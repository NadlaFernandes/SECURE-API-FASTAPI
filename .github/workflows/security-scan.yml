name: DevSecOps - Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  trivy-scan:
    name: Container & Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir Imagem Docker
        run: |
          docker build -t secure-api-fastapi:${{ github.sha }} .

      - name: Escanear imagem com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secure-api-fastapi:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'